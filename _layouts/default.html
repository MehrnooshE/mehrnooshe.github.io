<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {{ site.author }}{% else %}{{ site.author }}{% endif %}</title>
<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #e8e4de;
    --text: #1c1917;
    --muted: #78716c;
    --accent: #1c3f5e;
    --accent-light: #e8f0f7;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.7;
    font-weight: 300;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(250,249,247,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    z-index: 50;
    padding: 0 2rem;
  }
  .nav-inner {
    max-width: 820px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 52px;
  }
  .nav-name {
    font-family: var(--serif);
    font-size: 1.1rem; font-weight: 400;
    color: var(--text); text-decoration: none;
    letter-spacing: 0.01em;
  }
  .nav-links { display: flex; gap: 2rem; align-items: center; }
  .nav-links a {
    font-size: 12px; font-weight: 400;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); text-decoration: none;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--text); }
  .nav-links a.cv-btn {
    border: 1px solid var(--border);
    padding: 4px 12px; border-radius: 2px;
    transition: all 0.2s;
  }
  .nav-links a.cv-btn:hover {
    background: var(--accent); color: white; border-color: var(--accent);
  }

  /* ── PAGE WRAP ── */
  .page-wrap {
    max-width: 820px; margin: 0 auto;
    padding: 90px 2rem 5rem;
  }

  /* ── CONTENT (post body) ── */
  .post-content { max-width: 660px; }
  .post-content h1, .post-content h2, .post-content h3 {
    font-family: var(--serif); font-weight: 400;
    color: var(--text); margin: 2rem 0 0.75rem; line-height: 1.2;
  }
  .post-content h1 { font-size: 2rem; }
  .post-content h2 { font-size: 1.5rem; }
  .post-content h3 { font-size: 1.2rem; }
  .post-content p { margin-bottom: 1.25rem; color: var(--muted); }
  .post-content a { color: var(--accent); }
  .post-content ul, .post-content ol {
    padding-left: 1.5rem; margin-bottom: 1.25rem; color: var(--muted);
  }
  .post-content li { margin-bottom: 0.4rem; }
  .post-content code {
    font-size: 0.85em;
    background: var(--accent-light); color: var(--accent);
    padding: 1px 6px; border-radius: 3px;
  }
  .post-content pre {
    background: #f0eeea; border: 1px solid var(--border);
    border-radius: 4px; padding: 1.25rem;
    overflow-x: auto; margin-bottom: 1.25rem;
  }
  .post-content pre code { background: none; padding: 0; color: var(--text); }
  .post-content blockquote {
    border-left: 2px solid var(--accent);
    padding-left: 1.25rem; margin: 1.5rem 0;
    color: var(--muted); font-style: italic;
  }
  .post-content img { max-width: 100%; border-radius: 4px; margin: 1.5rem 0; }
  .post-content hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

  /* ── FOOTER ── */
  footer {
    max-width: 820px; margin: 0 auto;
    padding: 1.5rem 2rem 2.5rem;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--muted);
    flex-wrap: wrap; gap: 0.5rem;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--text); }

  @media (max-width: 640px) {
    nav, .page-wrap { padding-left: 1.25rem; padding-right: 1.25rem; }
    footer { padding-left: 1.25rem; padding-right: 1.25rem; }
    .nav-links { gap: 1.25rem; }
  }
</style>
{{ page.head_extra }}
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-name" href="/">{{ site.author }}</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/#posts">Posts</a>
      <a href="https://mehrnooshe.github.io/Oncology-Digest/" target="_blank">Digest</a>
      <a href="/cv.pdf" target="_blank" class="cv-btn">CV ↗</a>
    </div>
  </div>
</nav>

<div class="page-wrap">
  {{ content }}
</div>

<footer>
  <span>{{ site.author }} · Boston, MA</span>
  <span>
    <a href="https://linkedin.com/in/mehrnoosh-emamifar" target="_blank">LinkedIn</a> ·
    <a href="https://github.com/MehrnooshE" target="_blank">GitHub</a> ·
    <a href="https://scholar.google.com" target="_blank">Scholar</a>
  </span>
</footer>

</body>
</html>
